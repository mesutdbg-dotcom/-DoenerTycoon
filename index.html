<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Döner Tycoon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🥙 Döner Tycoon</h1>
    <p>Vom kleinen Imbiss zum Döner-König!</p>
</header>

<main>

    <h2 id="money">0 €</h2>

    <button id="donerButton">
        🥙
    </button>

    <p>Klicke auf den Döner und verdiene Geld!</p>

    <section id="shop">

        <h2>🛒 Shop</h2>

        <button id="workerBtn">
            👨‍🍳 Mitarbeiter
            <br>
            <small>50 € • +1 €/Sekunde</small>
        </button>

        <button id="knifeBtn">
            🔪 Besseres Messer
            <br>
            <small>100 € • 2 €/Klick</small>
        </button>

        <button id="meatBtn">
            🥩 Premium-Fleisch
            <br>
            <small>250 € • 5 €/Klick</small>
        </button>

    </section>

</main>

<script src="script.js?v=12"></script>

</body>
</html>
