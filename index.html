<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🥙 Döner Tycoon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="nameOverlay">
    <div id="nameBox">
        <h2>🥙 Willkommen bei Döner Tycoon!</h2>
        <p>Wie soll dein Dönerladen heißen?</p>

        <input
            id="shopNameInput"
            type="text"
            maxlength="24"
            placeholder="z. B. Mesut's Döner"
        >

        <button id="startGameBtn">
            ✅ Spiel starten
        </button>
    </div>
</div>

<header>
    <h1 id="shopTitle">🥙 Döner Tycoon</h1>
    <p>Vom kleinen Imbiss zum Döner-König!</p>
</header>

<main>

    <div id="levelAnzeige"></div>

    <div id="incomeAnzeige">
        ⚡ 0 € pro Sekunde
    </div>

    <h2 id="money">0 €</h2>

    <button id="donerButton">🥙</button>

    <p>Klicke auf den Döner und verdiene Geld!</p>

    <section id="shop">

        <h2>🛒 Shop</h2>

        <button id="workerBtn">
            👨‍🍳 Mitarbeiter
            <br>
            <small>50 € • +1 €/Sekunde</small>
        </button>

        <button id="knifeBtn">
            🔪 Besseres Messer
            <br>
            <small>100 € • 2 €/Klick</small>
        </button>

        <button id="meatBtn">
            🥩 Premium-Fleisch
            <br>
            <small>250 € • 5 €/Klick</small>
        </button>

    </section>

</main>

<script type="module" src="firebase.js"></script>
<script src="script.js?v=20"></script>

</body>
</html>
